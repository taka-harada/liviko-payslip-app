const showTab = (tabId) => {
  const tabContent = document.querySelectorAll('.tab-content')
  tabContent.forEach((content) => {
    content.classList.add('hidden')
  })

  const selectedTab = document.getElementById(tabId)
  if(selectedTab) {
    selectedTab.classList.remove('hidden')
  }

  const sideMenuButtons = document.querySelectorAll('.sidemenu-button')
  sideMenuButtons.forEach((menu) => {
    menu.classList.remove('bg-[#e7eef4]')
  })

  const clickedSideMenuButton = document.querySelector(`[onclick="showTab('${tabId}')"]`)
  if(clickedSideMenuButton) {
    clickedSideMenuButton.classList.add('bg-[#e7eef4]')
  }
}

// 「ファイルアップロード」押下
const handleUpload = () => {
  //メッセージエリアを削除
  removeMessageAreaDom()

  const fileUploadForm = document.getElementById('uploadFile')
  const fileInput = fileUploadForm.querySelector('input[type="file"]')
  const uploadArea = document.getElementById('uploadArea')
  const messageArea = document.getElementById('uploadStatusArea')

  // ファイルが選択されていない場合
  if(!fileInput.files.length) {
    createMessageAreaDom(messageArea, 'ファイルを選択してください')
    return
  } else {
    const file = fileInput.files[0]
    const allowedFormat = /(\.csv)$/i

    // CSVファイル以外が選択された場合
    if(!allowedFormat.exec(file.name)) {
      createMessageAreaDom(messageArea, 'CSVファイルを選択してください')
      return
    }

    // 処理中メッセージ表示
    //createMessageAreaDom(messageArea, '処理中...')
    const loadingUpload = document.getElementById('loading-upload')
    loadingUpload.classList.remove('hidden')

    // Encoding.jsを使ってShift-JISをUTF-8へエンコード
    const reader = new FileReader()
    reader.onload = (e) => {
      const arrayBuffer = e.target.result
      const uint8Array = new Uint8Array(arrayBuffer)

      // エンコーディングを検出
      const detected = jschardet.detect(uint8Array)

      let utf8Array
      // Shift_JISだったらUTF-8にエンコード
      if(detected.encoding.toLowerCase() === 'shift_jis') {
        utf8Array = Encoding.convert(uint8Array, {to: 'UNICODE', from: 'SJIS', type: 'arraybuffer'})
      } else {
      // MEMO:それ以外（UTF-8はもちろんASCIIとか）は一旦そのまま。もっと広くこのアプリを展開するようになったら厳密に指定した方がいいかも
        utf8Array = uint8Array
      }
      const utf8Blob = new Blob([utf8Array], { type: 'text/csv' })

      // BlobをBase64エンコードして文字列として渡す（google.script.runでBlobデータを丸ごと渡せないっぽい）
      const readerBase64 = new FileReader()
      readerBase64.onload = () => {
        const base64Data = readerBase64.result.split(',')[1]
        // ファイルアップロード実行
        google.script.run.withSuccessHandler(handleUploadSuccess).withFailureHandler(handleUploadError).uploadFileBase64(base64Data, file.name)
      }
      readerBase64.readAsDataURL(utf8Blob)
    }
    reader.readAsArrayBuffer(file)
  }
}

const submitSelectBox = (e) => {

      loading.classList.remove('hidden')
      // const messageArea = document.getElementById('statusMessage')

    }

        showToast('toast-success', 'PDF送信が成功しました')

        showToast('toast-danger', 'PDF送信が失敗しました')
        console.log("サーバーからの応答をログに出力（失敗）", res)

  } else {
    console.log("すべて失敗")
